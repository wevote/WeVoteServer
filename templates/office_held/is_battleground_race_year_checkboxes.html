{# templates/office_held/is_battleground_race_year_checkboxes.html #}
{% load template_filters %}
{% is_battleground_years_available as battleground_years %}
<span class="u-no-break">Is battleground:&nbsp;
  {% for year in battleground_years %}
  <label for="is_battleground_race_{{ year }}_id">
    <input type="checkbox"
           name="is_battleground_race_{{ year }}"
           id="is_battleground_race_{{ year }}_id"
           value="1"
           {% if office_held|is_battleground_race:year %}checked{% endif %} />
    {{ year }}&nbsp;&nbsp;&nbsp;
  </label>
  {% endfor %}
</span>
